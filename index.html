<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1b2547">
<title>Sternen-Roboter</title>
<meta name="description" content="Sternen-Roboter – Logikspiel zum Wege-Planen für Kinder ab ca. 5 Jahren. Pfeilkarten legen, den Roboter fahren lassen, Sterne einsammeln und nach Hause.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Roboter">
<meta property="og:title" content="Sternen-Roboter">
<meta property="og:description" content="Logikspiel zum Wege-Planen für Kinder: Pfeilkarten legen, Roboter schauen zu.">
<meta property="og:image" content="https://pappet.github.io/sternen-roboter/icons/icon-512.png">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/favicon-32.png">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<style>
@font-face{
  font-family:'Fredoka';font-style:normal;font-weight:300 700;font-display:swap;
  src:url('./fonts/fredoka-latin.woff2') format('woff2');
}
:root{
  --ink:#26313D; --hell:#F2F5FF; --gold:#FFC53D; --gruen:#3DBE6E; --rot:#E4572E;
  --tuerkis:#2FB8C6; --kachel:#EAF0FF; --kachel2:#DCE5FA; --panel:rgba(255,255,255,.10);
  --s:64px; --gap:6px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#1b2547}
body{
  font-family:'Fredoka',ui-rounded,system-ui,sans-serif;color:var(--ink);
  user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;
  touch-action:none;
  background:radial-gradient(120% 90% at 50% 0%,#33457d 0%,#233158 45%,#161e3c 100%);
}
#app{height:100dvh;display:flex;flex-direction:column}

/* ---------- Kopfzeile ---------- */
header{
  flex:none;height:calc(62px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:8px;
  padding:calc(8px + env(safe-area-inset-top,0px)) calc(10px + env(safe-area-inset-right,0px)) 8px calc(10px + env(safe-area-inset-left,0px));
  z-index:6;
}
.chip{
  background:#fff;border-radius:999px;padding:4px 14px;font-weight:700;font-size:20px;
  border:none;box-shadow:0 3px 0 rgba(0,0,0,.25);font-family:inherit;color:var(--ink);
  display:flex;align-items:center;gap:6px;min-height:44px;
}
.chip b{font-size:22px}
#spacer{flex:1}

/* ---------- Bühne ---------- */
#buehne{
  flex:1;min-height:0;overflow:hidden;display:grid;gap:8px;
  padding:0 calc(10px + env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) calc(10px + env(safe-area-inset-left,0px));
  grid-template-columns:minmax(0,1fr);
  grid-template-rows:1fr auto auto;
  grid-template-areas:"feld" "plan" "tasten";
}
@media (orientation:landscape){
  #buehne{
    /* minmax(0,1fr): der Bauplan darf schmaler werden als seine 12 Slots,
       sonst quetscht er auf 1024er-Tablets die Tasten-Spalte weg */
    grid-template-columns:minmax(0,1fr) minmax(260px,32vw);
    grid-template-rows:1fr auto;
    grid-template-areas:"feld tasten" "plan tasten";
  }
}
#feldWrap{grid-area:feld;min-height:0;display:flex;flex-direction:column;align-items:center;gap:6px}
#plan{grid-area:plan}
#tasten{grid-area:tasten;display:flex;flex-direction:column;justify-content:center;gap:10px}

/* ---------- Zielleiste ---------- */
#leiste{
  flex:none;display:flex;align-items:center;justify-content:center;gap:10px;
  background:var(--panel);border-radius:999px;padding:5px 16px;min-height:46px;color:#fff;
}
#leiste .ic{width:32px;height:32px;opacity:.35;transition:opacity .3s,transform .3s}
#leiste .ic.an{opacity:1;transform:scale(1.15)}
#leiste .pfeilchen{color:#fff;opacity:.5;font-size:20px}
.optChip{
  background:rgba(255,255,255,.16);border-radius:999px;padding:3px 12px;
  font-size:18px;font-weight:700;white-space:nowrap;
}

/* ---------- Spielfeld ---------- */
#feldBox{flex:1;min-height:0;min-width:0;width:100%;overflow:hidden;display:flex;align-items:center;justify-content:center}
#feld{position:relative;border-radius:18px}
.kachel{
  position:absolute;border-radius:12px;background:var(--kachel);
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.08);
  display:flex;align-items:center;justify-content:center;
}
.kachel.dunkel{background:var(--kachel2)}
.kachel.stein{background:transparent;box-shadow:none}
.kachel.spur{background:#BFF0D8}
.kachel svg{width:76%;height:76%;pointer-events:none}
.kachel.stein svg{width:100%;height:100%}
.flugstern{position:fixed;z-index:120;pointer-events:none;
  transition:transform .5s cubic-bezier(.35,0,.25,1),opacity .5s ease}
.flugstern svg{width:100%;height:100%;display:block}
#roboter{
  position:absolute;transition:transform .30s cubic-bezier(.4,1.5,.5,1);
  will-change:transform;z-index:3;
}
#roboter .koerper,#roboter .richtung{position:absolute;inset:0}
#roboter .richtung{transition:transform .2s ease}
#roboter svg{width:100%;height:100%;display:block}
/* Idle: atmet leicht, wenn nichts passiert */
#roboter .koerper{animation:idlen 3.4s ease-in-out infinite}
@keyframes idlen{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5%)}}
/* Sieg-Tanz: hüpfen und wiegen */
#roboter.tanz .koerper{animation:tanz 1.5s ease}
@keyframes tanz{
  0%,100%{transform:none}
  15%{transform:translateY(-18%) rotate(-8deg)}
  30%{transform:none}
  45%{transform:translateY(-18%) rotate(8deg)}
  60%{transform:none}
  78%{transform:translateY(-14%) scale(1.06)}
}
#roboter.bums{animation:bums .4s ease}
@keyframes bums{0%,100%{filter:none}30%{filter:brightness(1.6) saturate(.4)}}
.ziel-leuchten{animation:leuchten 1s ease infinite}
@keyframes leuchten{0%,100%{filter:none}50%{filter:brightness(1.25)}}

/* ---------- Bauplan ---------- */
#plan{
  display:grid;gap:6px;background:var(--panel);border-radius:18px;padding:8px;
  justify-content:center;align-content:center;
  width:100%;min-width:0;justify-self:center;
  /* max-width setzt zeichnePlan (Spalten × 74px): Slots wachsen nie über 74px,
     schrumpfen aber mit der verfügbaren Breite */
}
.slot{aspect-ratio:1/1;width:100%;min-width:0}
.slot{
  border-radius:12px;border:3px dashed rgba(255,255,255,.22);
  display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.04);
}
.slot.voll{border:none;background:#fff;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.slot.voll svg{width:70%;height:70%}
.loopTxt{font-weight:700;font-size:1.6em;color:var(--karteFuell,#2E6FB7)}
.pfeilDreh{display:flex;align-items:center;justify-content:center;width:100%;height:100%}
.pfeilDreh svg{display:block}
.slot.dran{outline:4px solid var(--gold);outline-offset:2px;transform:scale(1.06)}
.slot.neu{animation:pop .25s ease}
.slot.fehler{outline:4px solid var(--rot);outline-offset:2px}
@keyframes pop{from{transform:scale(.4)}to{transform:scale(1)}}

/* ---------- Tasten ---------- */
#pad{
  display:grid;gap:8px;
  grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);
  align-self:center;width:min(100%,var(--padW,330px));aspect-ratio:1/1;max-height:42vh;
}
@media (orientation:landscape){#pad{max-height:none}}
button.knopf{
  border:none;border-radius:18px;background:#fff;box-shadow:0 5px 0 rgba(0,0,0,.28);
  font-family:inherit;font-size:26px;font-weight:700;color:var(--ink);
  display:flex;align-items:center;justify-content:center;min-height:56px;
  transition:transform .08s;
}
button.knopf:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.28)}
button.knopf svg{width:62%;height:62%}
.pfeil{background:#fff}
.pfeil[data-d="0"]{grid-column:2;grid-row:1}
.pfeil[data-d="3"]{grid-column:1;grid-row:2}
.pfeil[data-d="1"]{grid-column:3;grid-row:2}
.pfeil[data-d="2"]{grid-column:2;grid-row:3}
#b_los{grid-column:2;grid-row:2;background:var(--gruen);color:#fff}
#b_los svg{width:52%;height:52%}
#b_los.bereit{animation:puls 1.1s ease-in-out infinite}
@keyframes puls{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.wackel{animation:wackel .6s ease 2}
@keyframes wackel{0%,100%{transform:rotate(0)}25%{transform:rotate(-9deg)}75%{transform:rotate(9deg)}}
#extra{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;align-self:center;width:min(100%,var(--padW,330px))}
#extra .knopf{font-size:26px;min-height:74px;background:#EEF2FF}
#b_schleife{color:var(--karteFuell,#2E6FB7);font-weight:700}
#tasten.aus{opacity:.45;pointer-events:none}

/* ---------- Startseite / Fest ---------- */
.overlay{
  position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:18px;text-align:center;
  background:radial-gradient(120% 90% at 50% 0%,#3a4d8a 0%,#233158 45%,#141b36 100%);
  color:#fff;padding:20px;
}
.overlay[hidden]{display:none}
.overlay h1{font-size:clamp(28px,7vw,52px);margin:0;letter-spacing:.5px}
.overlay .gross{width:min(38vw,190px)}
.gross svg{width:100%;height:auto}
.gross.schweben{animation:schweben 2.6s ease-in-out infinite}
@keyframes schweben{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.grossKnopf{
  border:none;border-radius:999px;background:var(--gold);color:#3a2a00;
  font-family:inherit;font-weight:700;font-size:clamp(22px,4.5vw,30px);
  padding:16px 46px;box-shadow:0 6px 0 rgba(0,0,0,.3);min-height:72px;
  animation:puls 1.4s ease-in-out infinite;
}
.kleinKnopf{
  border:none;border-radius:999px;background:rgba(255,255,255,.16);color:#fff;
  font-family:inherit;font-weight:600;font-size:19px;padding:12px 26px;min-height:54px;
}
#sammlung{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;font-size:40px;max-width:80vw;margin-top:6px}
/* ---------- Werkstatt ---------- */
#werkstatt{justify-content:flex-start;gap:12px;padding:12px 10px 16px}
#wKopf{display:flex;align-items:center;gap:12px;font-size:30px;flex:none}
#wInhalt{flex:1;width:100%;overflow-y:auto;touch-action:pan-y;display:flex;flex-direction:column;gap:14px;
  padding:4px 2px}
.reihe{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.08);border-radius:20px;padding:8px 10px}
.reiheKopf{font-size:30px;flex:none;width:44px;text-align:center}
.kacheln{display:flex;gap:10px;flex-wrap:wrap}
.wItem{position:relative;border:none;border-radius:18px;background:#fff;box-shadow:0 4px 0 rgba(0,0,0,.25);
  width:clamp(76px,13vmin,108px);height:clamp(76px,13vmin,108px);padding:6px;font-family:inherit}
.wItem .vs{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.wItem .vs svg{width:100%;height:100%}
.wItem .vs.welt{border-radius:12px;overflow:hidden;display:grid;grid-template-columns:1fr 1fr;gap:3px;padding:5px}
.wItem .vs.welt .mini{border-radius:6px;display:flex;align-items:center;justify-content:center;padding:2px}
.wItem.aktiv{outline:5px solid var(--gold);outline-offset:2px}
.wItem.zu{filter:grayscale(1) brightness(.85);background:#D7DDEA}
.wItem .schloss{position:absolute;inset:auto 0 -2px 0;background:rgba(0,0,0,.62);color:#fff;
  border-radius:0 0 14px 14px;font-size:15px;font-weight:700;padding:2px 0}
.wItem .haken{position:absolute;top:-8px;right:-8px;background:var(--gruen);color:#fff;
  width:30px;height:30px;border-radius:50%;font-size:18px;line-height:30px;box-shadow:0 2px 0 rgba(0,0,0,.25)}
.konfetti{position:fixed;inset:0;pointer-events:none;z-index:101;overflow:hidden}
.konf{position:absolute;font-size:28px;animation:fall 2.2s linear forwards}
@keyframes fall{from{transform:translateY(-10vh) rotate(0)}to{transform:translateY(110vh) rotate(420deg);opacity:.2}}
/* kleine Funken an einer Kachel (beim Einsammeln) */
.kon.sparkle{animation:partikel .7s ease forwards!important}
@keyframes partikel{
  from{transform:translate(0,0) scale(.4);opacity:1}
  to{transform:translate(var(--dx,0),var(--dy,-40px)) scale(1.1);opacity:0}
}
/* Sternverteilung im Fest-Overlay: drei Sterne fliegen nacheinander rein */
.sternReihe{display:flex;gap:14px;justify-content:center}
.festStern{width:min(17vw,86px);opacity:0;transform:scale(.2) rotate(-40deg);
  animation:sternPop .5s cubic-bezier(.3,1.6,.5,1) var(--d,0s) forwards}
.festStern svg{width:100%;height:auto;display:block}
@keyframes sternPop{to{opacity:1;transform:scale(1) rotate(0)}}
.sternMini{font-size:26px;letter-spacing:4px;opacity:.9}
.bonusChip{background:var(--gold);color:#3a2a00;border-radius:999px;padding:8px 20px;
  font-weight:700;font-size:20px;box-shadow:0 4px 0 rgba(0,0,0,.3)}
@media (max-width:430px){
  header{gap:5px}
  .chip{padding:4px 9px;font-size:17px;min-height:40px}
  .chip b{font-size:19px}
}
/* mehrere Neuheiten im Fest nebeneinander */
.festNeu{width:min(22vw,120px)}
.festNeu .vs svg{width:100%;height:auto}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <button class="chip" id="punkteChip">⭐ <b id="punkte">0</b></button>
    <button class="chip" id="aufgabeChip">🏁 <b id="aufgabe">1</b></button>
    <div id="spacer"></div>
    <button class="chip" id="ton" aria-label="Ton an oder aus">🔊</button>
    <button class="chip" id="werkstattChip" aria-label="Werkstatt">🛠</button>
    <button class="chip" id="freiChip" aria-label="Freies Fahren">🪐</button>
    <button class="chip" id="fs" aria-label="Vollbild">⛶</button>
  </header>

  <div id="buehne">
    <div id="feldWrap">
      <div id="leiste"></div>
      <div id="feldBox"><div id="feld"></div></div>
    </div>
    <div id="plan"></div>
    <div id="tasten">
      <div id="pad">
        <button class="knopf pfeil" data-d="0" aria-label="nach oben"></button>
        <button class="knopf pfeil" data-d="3" aria-label="nach links"></button>
        <button class="knopf" id="b_los" aria-label="Los"></button>
        <button class="knopf pfeil" data-d="1" aria-label="nach rechts"></button>
        <button class="knopf pfeil" data-d="2" aria-label="nach unten"></button>
      </div>
      <div id="extra">
        <button class="knopf" id="b_schleife" aria-label="Wiederhol-Karte ×3">×3</button>
        <button class="knopf" id="b_undo" aria-label="letzte Karte weg">↩</button>
        <button class="knopf" id="b_clear" aria-label="alle Karten weg">✖</button>
        <button class="knopf" id="b_hoer" aria-label="nochmal anhören">🔊</button>
      </div>
    </div>
  </div>
</div>

<div class="overlay" id="start">
  <div class="gross schweben" id="startBot"></div>
  <h1>Sternen-Roboter</h1>
  <button class="grossKnopf" id="go">Los geht's</button>
  <button class="kleinKnopf" id="goFrei">🪐 Freies Fahren</button>
  <div id="sammlung"></div>
</div>

<div class="overlay" id="fest" hidden>
  <div class="gross" id="festBild"></div>
  <h1 id="festText">Geschafft!</h1>
  <button class="grossKnopf" id="weiter">Weiter</button>
  <button class="kleinKnopf" id="nochmal">▶ Nochmal schauen</button>
  <button class="kleinKnopf" id="wKnopf" hidden>🛠 Werkstatt öffnen</button>
</div>

<div class="overlay" id="werkstatt" hidden>
  <div id="wKopf"><span class="chip">⭐ <b id="wSterne">0</b></span><span id="wTitel">🛠</span></div>
  <div id="wInhalt"></div>
  <button class="grossKnopf" id="wFertig">Fertig</button>
</div>

<script>
/* =========================================================================
   Sternen-Roboter — Wege planen mit Pfeilkarten
   Eine Datei, keine Bibliotheken. Name des Kindes: nur in KIND.
   ========================================================================= */
/* ==== TESTBLOCK-START (nur Logik, keine DOM-Zugriffe) ==== */
const KIND = '';                      // z.B. 'Sofia' — wird ins Lob eingebaut
const SAVE_KEY = 'sternen-roboter-spielstand';
const MAX_KARTEN = 12;
const $ = id => document.getElementById(id);

const S = {sterne:0, aufgabe:0, sammlung:0, busy:false, frei:false, trostGegeben:false, ton:true,
           look:{bot:'tuerkis', welt:'weltraum', karte:'blau'}, neuOffen:[]};

function load(){
  try{
    const d = JSON.parse(localStorage.getItem(SAVE_KEY)||'{}');
    const look = Object.assign({}, S.look, d.look||{});
    Object.assign(S, d); S.look = look;
  }catch(e){}
}
function save(){ try{ localStorage.setItem(SAVE_KEY,
  JSON.stringify({sterne:S.sterne, aufgabe:S.aufgabe, sammlung:S.sammlung, look:S.look, ton:S.ton, trostFuer:S.trostFuer})); }catch(e){} }

/* ---------------------------------------------------------------- Ton --- */
let AC = null;
function ac(){
  if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  if(AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(f, d=.12, type='sine', vol=.16, delay=0, slide=0){
  // 🔇 und Hintergrund: gar nichts von sich geben — das Tablet teilt sich
  // Audio/TTS mit allen anderen Apps, im Hintergrund schweigt das Spiel.
  if(S.ton === false || (typeof document !== 'undefined' && document.hidden)) return;
  const a = ac(); if(!a) return;
  const t = a.currentTime + delay;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if(slide) o.frequency.exponentialRampToValueAtTime(f*slide, t+d);
  g.gain.setValueAtTime(.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t+.01);
  g.gain.exponentialRampToValueAtTime(.0001, t+d);
  o.connect(g).connect(a.destination);
  o.start(t); o.stop(t+d+.03);
}
const SFX = {
  karte: d => tone([680,600,520,760][d], .07, 'triangle', .13),
  loop:  () => tone(440, .16, 'triangle', .13, 0, 1.5),      // ×3-Karte: aufsteigender Wisch
  schritt: () => tone([340,365,325,380,350][(Math.random()*5)|0], .07, 'sine', .10),
  pop:   () => tone(520, .1, 'sine', .2, 0, 1.8),
  klick: () => tone(700, .06, 'triangle', .12),
  nope:  () => tone(210, .14, 'square', .05),
  ding:  () => { tone(1318,.4,'sine',.15); tone(1760,.5,'sine',.1,.08); },
  sternPop: i => tone(988 + i*222, .28, 'sine', .16, i*.33),  // Stern fliegt ins Fest
  jubel: () => [523,659,784,1047].forEach((f,i) => tone(f,.2,'triangle',.16,i*.1)),
  tanz:  () => [660,880,990,1320].forEach((f,i) => tone(f,.15,'triangle',.15,i*.18)),
  fest:  () => [523,659,784,1047,1319].forEach((f,i) => tone(f,.28,'triangle',.15,i*.12))
};
/* Kurze Vibration, falls das Gerät es kann (Tablet) */
function vib(m){ try{ navigator.vibrate && navigator.vibrate(m); }catch(e){} }

/* -------------------------------------------------------- Sprachausgabe -- */
const Voice = (() => {
  const HAS = 'speechSynthesis' in window;
  let voice = null, queue = [], playing = false, epoch = 0;
  function pickVoice(){
    if(!HAS) return;
    const de = speechSynthesis.getVoices().filter(v => v.lang && v.lang.toLowerCase().startsWith('de'));
    const wert = v => (v.lang.toLowerCase().startsWith('de-de') ? 2 : 0) + (v.localService ? 1 : 0);
    voice = de.sort((a,b) => wert(b) - wert(a))[0] || null;
  }
  if(HAS){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
  function estimate(text, rate){ return Math.min(12000, 900 + (text.length/Math.max(.5,rate))*90); }
  function speakOne(item){
    return new Promise(res => {
      if(!HAS) return res();
      if(document.hidden) return res();          // Hintergrund: nicht sprechen
      let done = false;
      const finish = () => { if(!done){ done = true; clearTimeout(wd); res(); } };
      const u = new SpeechSynthesisUtterance(item.text);
      u.lang = 'de-DE'; if(voice) u.voice = voice;
      u.rate = item.rate || .88; u.pitch = item.pitch || 1.12;
      u.onend = finish; u.onerror = finish;
      const wd = setTimeout(finish, estimate(item.text, u.rate));
      speechSynthesis.speak(u);
    });
  }
  async function run(){
    if(playing) return;
    playing = true;
    const mine = epoch;
    while(queue.length && mine === epoch){
      const item = queue.shift();
      if(item.text) await speakOne(item);
      if(item.pause && mine === epoch) await new Promise(r => setTimeout(r, item.pause));
    }
    playing = false;
  }
  return {
    say(items){
      if(typeof S !== 'undefined' && S.ton === false) return;   // 🔇: gar nicht erst anstehen
      if(typeof document !== 'undefined' && document.hidden) return;   // Hintergrund: schweigen
      queue.push(...[].concat(items).filter(Boolean)); run();
    },
    flush(){ epoch++; queue = []; playing = false; if(HAS) speechSynthesis.cancel(); },
    replace(items){ this.flush(); this.say(items); }
  };
})();

/* Aktuelles Level als Objekt */
let L = null;           // {rows,cols,wall,start,ziel,sterne,schluessel,tuer,opt,sag,neu}
let prog = [];          // Programm: 0..3 = Pfeil, 'x' = ×3-Karte
let bot = {r:0,c:0,d:0};
let mask = 0;           // eingesammelte Sterne + Schlüssel als Bits (laufender Versuch)
const DIRS = [[-1,0],[0,1],[1,0],[0,-1]];
const EXP_CAP = 64;     // maximale Aufführungslänge (Schutz vor ×3-Kaskaden)

function parse(g){
  const lvl = {rows:g.length, cols:g[0].length, wall:new Set(), sterne:[],
               start:null, ziel:null, schluessel:null, tuer:null};
  g.forEach((zeile,r) => [...zeile].forEach((ch,c) => {
    if(ch === '#') lvl.wall.add(r+','+c);
    else if(ch === '*') lvl.sterne.push({r,c});
    else if(ch === 'R') lvl.start = {r,c};
    else if(ch === 'Z') lvl.ziel = {r,c};
    else if(ch === 'K') lvl.schluessel = {r,c};
    else if(ch === 'T') lvl.tuer = {r,c};
  }));
  return lvl;
}
const frei = (r,c) => r>=0 && c>=0 && r<L.rows && c<L.cols && !L.wall.has(r+','+c);
const keyBit = () => L.schluessel ? (1 << L.sterne.length) : 0;
const maskZiel = () => ((1 << L.sterne.length) - 1) | keyBit();
/* Die Tür ist nur passierbar, wenn der Schlüssel schon eingesammelt ist */
function passierbar(r,c,m){
  if(!frei(r,c)) return false;
  if(L.tuer && L.tuer.r === r && L.tuer.c === c && !(m & keyBit())) return false;
  return true;
}
/* Ein Zug von (r,c) in Richtung d; null bei Wand oder verschlossener Tür */
function schrittVon(r,c,d,m){
  const nr = r + DIRS[d][0], nc = c + DIRS[d][1];
  if(!passierbar(nr,nc,m)) return null;
  let mm = m;
  const si = L.sterne.findIndex(s => s.r === nr && s.c === nc);
  if(si >= 0) mm |= (1 << si);
  if(L.schluessel && L.schluessel.r === nr && L.schluessel.c === nc) mm |= keyBit();
  return {r:nr, c:nc, mask:mm};
}
/* ×3-Karte: wiederholt alles, was vor ihr liegt, drei Mal (also 2× zusätzlich) */
function expandiere(karten){
  let exp = [], map = [];   // map: von welchem Bauplan-Slot stammt jeder gespielte Zug
  for(let slot=0; slot<karten.length; slot++){
    const k = karten[slot];
    if(k === 'x'){
      if(!exp.length) continue;                 // ×3 ganz vorne: keine Wirkung
      if(exp.length*3 > EXP_CAP) return null;   // zu lang für eine Aufführung
      exp = exp.concat(exp, exp);
      map = map.concat(map, map);
    }else{ exp.push(k); map.push(slot); }
  }
  return {exp, map};
}
/* Breitensuche über Züge (0..3); Zustand = Position + Sammel-Maske */
function bfs(sR, sC, maskStart){
  const startKey = sR+','+sC+','+maskStart;
  const map = new Map([[startKey, {r:sR, c:sC, mask:maskStart, dist:0, weg:[]}]]);
  const q = [startKey];
  while(q.length){
    const st = map.get(q.shift());
    for(let d=0; d<4; d++){
      const s = schrittVon(st.r, st.c, d, st.mask);
      if(!s) continue;
      const kk = s.r+','+s.c+','+s.mask;
      if(map.has(kk)) continue;
      map.set(kk, {r:s.r, c:s.c, mask:s.mask, dist:st.dist+1, weg:[...st.weg, d]});
      q.push(kk);
    }
  }
  return map;
}
/* Kürzeste Lösung nur mit Pfeilen */
function loesung(startR, startC, maskStart){
  const hit = bfs(startR, startC, maskStart).get(L.ziel.r+','+L.ziel.c+','+maskZiel());
  return hit ? hit.weg : null;
}
/* Suche nach KARTEN (Pfeile oder ×3) — echte Karten-BFS: Zustand =
   (Position, Sammel-Maske, Aufführung). Jedes Kind kostet genau eine Karte
   mehr, darum ist der erste Treffer das kartenärmste Programm. Bei großen
   Rätseln ohne Loop-Lösung bricht das Budget ab und die klassische Pfeil-BFS
   dient als Fallback (deren Ergebnis stimmt immer, kennt nur kein ×3). */
const PLAN_NODES = 20000;   // Budget: hält die Suche auf Tablets unter ~100 ms
/* expStart: schon gespielte Züge (×3 wiederholt auch die), budget: wie viele
   Karten noch frei sind. Ergebnis null = in diesem Budget nicht lösbar. */
function planBFS(startR, startC, maskStart, expStart = [], budget = MAX_KARTEN){
  const zielKey = L.ziel.r+','+L.ziel.c+','+maskZiel();
  const fwd = bfs(startR, startC, maskStart);
  const direkt = fwd.get(zielKey);
  let best = direkt && direkt.weg.length <= budget ? direkt.weg : null;
  if(best && best.length <= 2) return best;
  const q = [{r:startR, c:startC, m:maskStart, exp:expStart, k:[]}];
  const gesehen = new Set([startR+','+startC+','+maskStart+','+expStart.join('')]);
  let nodes = 0;
  while(q.length){
    const k = q.shift();
    if(best && k.k.length >= best.length) continue;
    if(k.k.length >= budget) continue;
    for(let i=0; i<5; i++){
      const d = i < 4 ? i : 'x';
      let r, c, m, exp2, k2;
      if(d === 'x'){
        if(!k.exp.length) continue;                 // ×3 ganz vorne: keine Wirkung
        if(k.exp.length*3 > EXP_CAP) continue;      // zu lang für eine Aufführung
        exp2 = k.exp.concat(k.exp, k.exp);
        r = k.r; c = k.c; m = k.m;
        let ok = true;
        for(let p=0; p<2 && ok; p++){               // ×3 fährt die Aufführung 2× erneut
          for(const d2 of k.exp){
            const s = schrittVon(r,c,d2,m);
            if(!s){ ok = false; break; }
            r = s.r; c = s.c; m = s.mask;
          }
        }
        if(!ok) continue;
        k2 = [...k.k, 'x'];
      }else{
        const s = schrittVon(k.r, k.c, d, k.m);
        if(!s) continue;
        r = s.r; c = s.c; m = s.mask;
        exp2 = k.exp.concat(d);
        k2 = [...k.k, d];
      }
      nodes++;
      if(nodes > PLAN_NODES) return best;           // Budget aus: Fallback reicht
      const key = r+','+c+','+m+','+exp2.join('');
      if(gesehen.has(key)) continue;
      gesehen.add(key);
      if(r === L.ziel.r && c === L.ziel.c && m === maskZiel()){
        return (!best || k2.length < best.length) ? k2 : best;
      }
      q.push({r, c, m, exp:exp2, k:k2});
    }
  }
  return best;
}
/* Wo steht der Roboter nach dem bisherigen Programm? (für Tipps) */
function simuliere(karten){
  const ex = expandiere(karten);
  if(!ex) return {zuLang:true};
  let r = L.start.r, c = L.start.c, m = 0;
  for(const d of ex.exp){
    const s = schrittVon(r,c,d,m);
    if(!s) return {r, c, mask:m, bums:true};
    r = s.r; c = s.c; m = s.mask;
  }
  return {r, c, mask:m, exp:ex.exp};
}

/* ----------------------------------------------- Zufallslevel (endlos) --- */
/* Drei Sorten, damit Gelerntes nicht verloren geht: Sterne-Feld (5×5),
   Schlüssel & Tür (6×6, Tür liegt garantiert auf dem einzigen Weg) und
   Treppe (8–10, nur mit ×3 in 12 Karten schaffbar). Jede Aufgabe wird vor dem
   Anzeigen per Breitensuche geprüft.                                       */
const zuf = n => Math.floor(Math.random()*n);
function mitLevel(g, fn){ const merk = L; L = parse(g); try{ return fn(); } finally{ L = merk; } }
const zeilen = g => g.map(z => z.join(''));
function zufallSterne(){
  for(let versuch=0; versuch<400; versuch++){
    const n = 5;
    const g = Array.from({length:n}, () => Array(n).fill('.'));
    const frei2 = [];
    for(let r=0;r<n;r++) for(let c=0;c<n;c++) frei2.push({r,c});
    const zieh = () => frei2.splice(zuf(frei2.length), 1)[0];
    const anzSteine = 5 + zuf(3);
    for(let i=0;i<anzSteine;i++){ const p = zieh(); g[p.r][p.c] = '#'; }
    const st = zieh(); g[st.r][st.c] = 'R';
    const zi = zieh(); g[zi.r][zi.c] = 'Z';
    const anzSterne = 2 + zuf(2);
    for(let i=0;i<anzSterne;i++){ const p = zieh(); g[p.r][p.c] = '*'; }
    const lsg = mitLevel(zeilen(g), () => loesung(L.start.r, L.start.c, 0));
    if(lsg && lsg.length >= 7 && lsg.length <= 11)
      return {g:zeilen(g), sag:"Hol alle Sterne und fahr dann zum Haus."};
  }
  return null;
}
function zufallTuer(){
  for(let versuch=0; versuch<400; versuch++){
    const n = 6;
    const g = Array.from({length:n}, () => Array(n).fill('.'));
    const frei2 = [];
    for(let r=0;r<n;r++) for(let c=0;c<n;c++) frei2.push({r,c});
    const zieh = () => frei2.splice(zuf(frei2.length), 1)[0];
    // Haus einmauern: genau ein Nachbar ist die Tür, die übrigen Nachbarn Steine
    // → die Tür liegt garantiert auf dem einzigen Weg
    const zi = zieh(); g[zi.r][zi.c] = 'Z';
    const nachbarn = DIRS.map(([dr,dc]) => ({r:zi.r+dr, c:zi.c+dc})).filter(p => p.r>=0 && p.c>=0 && p.r<n && p.c<n);
    const tuer = nachbarn[zuf(nachbarn.length)];
    nachbarn.forEach(p => {
      const idx = frei2.findIndex(f => f.r === p.r && f.c === p.c);
      if(idx >= 0) frei2.splice(idx, 1);
      g[p.r][p.c] = (p === tuer) ? 'T' : '#';
    });
    const anzSteine = 5 + zuf(4);
    for(let i=0;i<anzSteine;i++){ const p = zieh(); g[p.r][p.c] = '#'; }
    for(const ch of ['R','K']){ const p = zieh(); g[p.r][p.c] = ch; }
    const anzSterne = 1 + zuf(2);
    for(let i=0;i<anzSterne;i++){ const p = zieh(); g[p.r][p.c] = '*'; }
    const lsg = mitLevel(zeilen(g), () => loesung(L.start.r, L.start.c, 0));
    if(!lsg || lsg.length < 8 || lsg.length > 12) continue;
    return {g:zeilen(g), sag:"Hol erst den Schlüssel, dann alle Sterne, und fahr zum Haus."};
  }
  return null;
}
/* Musterlösungen der Treppen (offline mit großem Budget berechnet) — die
   Sterne liegen auf dem Pfad, darum hängt die Lösung nur von der Größe ab */
const TREPPE_LSG = {8:[0,1,0,1,'x',0,1], 9:[0,1,0,1,'x',0,1,0,1], 10:[0,1,'x','x']};
function zufallTreppe(){
  const n = 8 + zuf(3);                       // 8, 9 oder 10 → 14, 16, 18 Züge
  const g = Array.from({length:n}, () => Array(n).fill('.'));
  g[n-1][0] = 'R'; g[0][n-1] = 'Z';
  // Sterne auf dem Treppenpfad (Stufenende k = (n-1-k, k)), damit ×3 passt
  const stufen = []; for(let k=1;k<n-1;k++) stufen.push(k);
  for(let i=0;i<2 && stufen.length;i++){ const k = stufen.splice(zuf(stufen.length),1)[0]; g[n-1-k][k] = '*'; }
  return {g:zeilen(g), lsg:TREPPE_LSG[n], sag:"Eine Treppe! Die Mal-drei-Karte hilft dir."};
}
function zufallsLevel(){
  const w = Math.random();
  const lvl = (w < .15 ? zufallTreppe() : w < .45 ? zufallTuer() : null) || zufallSterne();
  return lvl || LEVELS[LEVELS.length-1];
}
function levelDaten(i){ return i < LEVELS.length ? LEVELS[i] : zufallsLevel(); }

function baueFeld(){
  const feld = $('feld');
  feld.innerHTML = '';
  for(let r=0;r<L.rows;r++) for(let c=0;c<L.cols;c++){
    const k = document.createElement('div');
    k.className = 'kachel' + (((r+c)%2) ? ' dunkel' : '');
    k.dataset.rc = r+','+c;
    if(L.wall.has(r+','+c)){ k.classList.add('stein'); k.innerHTML = gewaehlt('welt').stein(); }
    else if(L.ziel && L.ziel.r === r && L.ziel.c === c){ k.innerHTML = gewaehlt('welt').ziel(); k.classList.add('ziel-leuchten'); }
    else if(L.tuer && L.tuer.r === r && L.tuer.c === c){ k.innerHTML = SVG_TUER; }
    else if(L.schluessel && L.schluessel.r === r && L.schluessel.c === c){ k.dataset.schluessel = '1'; k.innerHTML = SVG_SCHLUESSEL; }
    feld.appendChild(k);
  }
  L.sterne.forEach((s,i) => {
    const k = feld.querySelector(`[data-rc="${s.r},${s.c}"]`);
    if(k){ k.innerHTML = SVG_STERN; k.dataset.stern = i; }
  });
  const rb = document.createElement('div');
  rb.id = 'roboter';
  rb.innerHTML = `<div class="richtung">${SVG_RICHTUNG}</div><div class="koerper">${svgRoboter(gewaehlt('bot').f)}</div>`;
  feld.appendChild(rb);
  metrics();
  setzeRoboter(false);
}
function metrics(pass = 0){
  const rs = document.documentElement.style;
  if(pass === 0) rs.setProperty('--padW', '330px');
  let box = $('feldBox').getBoundingClientRect();
  if(!L || box.width < 20) return;
  // Hochkant: passt das Feld nicht mit 40px-Kacheln, den Tasten-Block verkleinern
  // (er ist quadratisch, jedes Pixel weniger Breite gibt dem Feld ein Pixel Höhe)
  if(pass === 0 && !matchMedia('(orientation:landscape)').matches){
    const fehlt = L.rows*42 - box.height;
    if(fehlt > 0){
      rs.setProperty('--padW', Math.max(210, 330 - fehlt) + 'px');
      box = $('feldBox').getBoundingClientRect();
    }
  }
  const s = Math.max(24, Math.floor(Math.min(box.width/L.cols, box.height/L.rows)) - 2);
  const gap = Math.max(4, Math.round(s*.08));
  document.documentElement.style.setProperty('--s', s+'px');
  document.documentElement.style.setProperty('--gap', gap+'px');
  const feld = $('feld');
  feld.style.width  = (L.cols*s)+'px';
  feld.style.height = (L.rows*s)+'px';
  feld.querySelectorAll('.kachel').forEach(k => {
    const [r,c] = k.dataset.rc.split(',').map(Number);
    k.style.left = (c*s + gap/2)+'px';
    k.style.top  = (r*s + gap/2)+'px';
    k.style.width  = (s-gap)+'px';
    k.style.height = (s-gap)+'px';
  });
  const rb = $('roboter');
  if(rb){ rb.style.width = (s-gap)+'px'; rb.style.height = (s-gap)+'px'; }
  setzeRoboter(false);
  // Das Feld verändert die verfügbare Fläche selbst — einmal nachrechnen.
  if(pass < 1) requestAnimationFrame(() => metrics(pass+1));
}
function setzeRoboter(weich){
  const rb = $('roboter'); if(!rb) return;
  const s = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--s'));
  const gap = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--gap'));
  rb.style.transition = weich ? '' : 'none';
  rb.style.transform = `translate(${bot.c*s + gap/2}px, ${bot.r*s + gap/2}px)`;
  const ri = rb.querySelector('.richtung');
  if(ri) ri.style.transform = `rotate(${bot.d*90}deg)`;   // nur der Pfeil dreht sich
  if(!weich) requestAnimationFrame(() => { rb.style.transition = ''; });
}

let tippTimer = null;
function tippPlanen(){
  clearTimeout(tippTimer);
  if(S.frei || document.hidden) return;              // im Hintergrund keine Tipps
  tippTimer = setTimeout(tippGeben, 13000);
}
function tippGeben(){
  if(!L || S.busy || S.frei || document.hidden) return;
  // Wo steht der Roboter nach dem bisherigen Programm?
  const sim = simuliere(prog);
  if(sim.zuLang){
    $('b_undo').classList.add('wackel');
    setTimeout(() => $('b_undo').classList.remove('wackel'), 1300);
    Voice.replace({text:'Das ist zu lang. Nimm eine Karte weg.'});
  }else if(sim.bums){
    $('b_undo').classList.add('wackel');
    setTimeout(() => $('b_undo').classList.remove('wackel'), 1300);
    Voice.replace({text:'Da ist eine Karte zu viel. Tipp auf den Pfeil zurück.'});
  }else{
    let lsg = null;
    // Handgebaute Level: liegt der Bauplan auf dem Musterlösungs-Pfad, den
    // nächsten Schritt vorschlagen — ohne Suchauftrag.
    if(L.lsg){
      const praefix = L.lsg.slice(0, prog.length).every((k,i) => k === prog[i]);
      if(praefix && prog.length < L.lsg.length) lsg = [L.lsg[prog.length]];
    }
    // Sonst: Suche ab der jetzigen Stellung — ×3 wiederholt auch die schon
    // liegenden Karten, und nur die freien Slots dürfen verplant werden.
    if(!lsg && prog.length < MAX_KARTEN) lsg = planBFS(sim.r, sim.c, sim.mask, sim.exp, MAX_KARTEN - prog.length);
    if(!lsg || !lsg.length){
      // So passt es nicht mehr in den Bauplan: eine Karte wegnehmen
      $('b_undo').classList.add('wackel');
      setTimeout(() => $('b_undo').classList.remove('wackel'), 1300);
      Voice.replace({text:'So passt der Weg nicht mehr. Nimm eine Karte weg.'});
    }else{
      const erster = lsg[0];
      const taste = erster === 'x' ? $('b_schleife')
        : document.querySelector(`.pfeil[data-d="${erster}"]`);
      if(taste){ taste.classList.add('wackel'); setTimeout(() => taste.classList.remove('wackel'), 1300); }
      const was = erster === 'x' ? 'Probier die Mal-drei-Karte.' : 'Probier diesen Pfeil.';
      Voice.replace({text: sim.mask !== maskZiel() ? 'Denk an die Sterne. ' + was : was});
    }
  }
  tippPlanen();
}
function neueAufgabe(){
  const daten = levelDaten(S.aufgabe);
  L = parse(daten.g);
  L.sag = daten.sag; L.neu = daten.neu; L.lsg = daten.lsg || null;
  // Bei handgebauten Leveln ist die Musterlösung (offline verifiziert) mitgeliefert;
  // nur Zufallslevel suchen selbst — mit Budget-Fallback auf die Pfeil-BFS.
  if(L.lsg){ L.opt = L.lsg.length; }
  else{
    const plan = planBFS(L.start.r, L.start.c, 0);
    L.opt = plan ? plan.length : 0;
  }
  prog = []; mask = 0;
  S.trostGegeben = S.trostFuer === S.aufgabe;   // nach Neuladen kein zweiter Trost-Stern

  $('b_schleife').hidden = S.aufgabe < LOOP_AB;   // ×3 erst, wenn sie eingeführt ist

function karteDazu(d){
  if(S.busy || prog.length >= MAX_KARTEN){ if(prog.length >= MAX_KARTEN) SFX.nope(); return; }
  ac();
  if(d === 'x' && !prog.length){           // ×3 ganz vorne hätte nichts zu wiederholen
    SFX.nope(); vib(30);
    Voice.replace({text:'Die Mal-drei-Karte braucht Karten davor. Leg erst einen Pfeil.'});
    tippPlanen(); return;
  }
  prog.push(d);
  if(d === 'x') SFX.loop(); else SFX.karte(d);
  zeichnePlan(prog.length-1);

}
function karteWeg(i){

const warte = ms => new Promise(r => setTimeout(r, ms));

/* Kleine Funken an einer Kachel (beim Einsammeln) */
function partikel(el, zeichen = '✨', n = 5){

/* Eingesammelter Stern fliegt sichtbar in die Zielleiste */
function sternFliegt(vonKachel, index){
  const a = vonKachel.getBoundingClientRect();
  const zielEl = $('leiste').querySelector(`.ic[data-s="${index}"]`);
  const b = zielEl ? zielEl.getBoundingClientRect() : a;
  const f = document.createElement('div');
  f.className = 'flugstern';
  f.innerHTML = SVG_STERN;
  f.style.left = a.left+'px'; f.style.top = a.top+'px';
  f.style.width = a.width+'px'; f.style.height = a.height+'px';
  document.body.appendChild(f);
  requestAnimationFrame(() => {
    const dx = (b.left + b.width/2) - (a.left + a.width/2);
    const dy = (b.top  + b.height/2) - (a.top + a.height/2);
    f.style.transform = `translate(${dx}px, ${dy}px) scale(${Math.max(.2, b.width/a.width)})`;
    f.style.opacity = '.85';
  });

}

async function starten(){
  if(S.busy || !prog.length) return;
  const ex = expandiere(prog);
  if(!ex){
    ac(); SFX.nope(); vib(40);
    const letzter = $('plan').children[prog.length-1];
    if(letzter){ letzter.classList.add('wackel'); setTimeout(() => letzter.classList.remove('wackel'), 1300); }
    Voice.replace({text:'Das ist zu lang für eine Fahrt. Nimm eine Karte weg.'});
    tippPlanen();
    return;
  }
  ac(); clearTimeout(tippTimer);
  S.busy = true; $('tasten').classList.add('aus');
  $('b_los').classList.remove('bereit');
  if(!S.frei){                       // Aufgabe: alles zurück auf Anfang
    bot = {r:L.start.r, c:L.start.c, d:bot.d};
    setzeRoboter(false);
    feldZuruecksetzen();
  }
  await warte(350);
  [...$('plan').children].forEach(s => s.classList.remove('fehler'));

  let gebumst = false, fehlerIdx = -1, tuerZu = false;
  for(let i=0;i<ex.exp.length;i++){
    const slot = ex.map[i];
    const slots = $('plan').children;
    [...slots].forEach(s => s.classList.remove('dran'));
    slots[slot].classList.add('dran');
    const d = ex.exp[i];
    bot.d = d;
    const zug = schrittVon(bot.r, bot.c, d, mask);
    if(!zug){
      const nr = bot.r + DIRS[d][0], nc = bot.c + DIRS[d][1];
      const verschlossen = !!(L.tuer && nr === L.tuer.r && nc === L.tuer.c && frei(nr,nc));
      if(!S.frei){ slots[slot].classList.add('fehler'); fehlerIdx = slot; tuerZu = verschlossen; }
      $('roboter').classList.add('bums');
      setzeRoboter(true); SFX.nope(); vib(35);
      await warte(450);
      $('roboter').classList.remove('bums');
      gebumst = true; break;
    }
    bot.r = zug.r; bot.c = zug.c;
    const k = $('feld').querySelector(`[data-rc="${zug.r},${zug.c}"]`);
    if(k) k.classList.add('spur');       // Spur auch im Aufgabenmodus
    setzeRoboter(true); SFX.schritt();
    await warte(330);
    mask = sammle(mask);
  }
  [...$('plan').children].forEach(s => s.classList.remove('dran'));

  if(S.frei){ S.busy = false; $('tasten').classList.remove('aus'); zeichnePlan(); return; }

  if(S.replay){                        // „Nochmal schauen": gleicher Lauf, keine Belohnung
    S.replay = false;
    const nochmalGewonnen = !gebumst && mask === maskZiel() && bot.r === L.ziel.r && bot.c === L.ziel.c;
    S.busy = false; $('tasten').classList.remove('aus'); zeichnePlan();
    if(nochmalGewonnen){ SFX.jubel(); zeigeFest(festInfo.gross, festInfo.optimal); }
    return;
  }

  const alleSachen = mask === maskZiel();
  const amZiel = L.ziel && bot.r === L.ziel.r && bot.c === L.ziel.c;
  if(!gebumst && alleSachen && amZiel) await gewonnen();
  else await fastGeschafft(gebumst, tuerZu, alleSachen, fehlerIdx);
}

/* Stern und Schlüssel an der aktuellen Position einsammeln */
function sammle(m){
  const si = L.sterne.findIndex(s => s.r === bot.r && s.c === bot.c);
  if(si >= 0 && !(m & (1<<si))){
    m |= (1 << si);
    const k = $('feld').querySelector(`[data-stern="${si}"]`);
    if(k){ sternFliegt(k, si); partikel(k); k.innerHTML = ''; }
    SFX.ding(); vib(15);
    setTimeout(zeichneLeiste, 420);
  }
  if(L.schluessel && L.schluessel.r === bot.r && L.schluessel.c === bot.c && !(m & keyBit())){
    m |= keyBit();
    const k = $('feld').querySelector('[data-schluessel]');
    if(k){ sternFliegt(k, 'k'); partikel(k); k.innerHTML = ''; }
    SFX.pop(); vib(15);
    if(L.tuer){
      const tk = $('feld').querySelector(`[data-rc="${L.tuer.r},${L.tuer.c}"]`);
      if(tk) tk.innerHTML = SVG_TUER_OFFEN;
    }
    Voice.say({text:'Der Schlüssel! Jetzt ist die Tür offen.'});
    setTimeout(zeichneLeiste, 420);
  }
  return m;
}

/* Feld auf Anfang: Sterne, Schlüssel, Tür und Spur zurück */
function feldZuruecksetzen(){
  mask = 0;
  L.sterne.forEach((s,i) => {
    const k = $('feld').querySelector(`[data-stern="${i}"]`);
    if(k) k.innerHTML = SVG_STERN;
  });
  const sk = $('feld').querySelector('[data-schluessel]');
  if(sk) sk.innerHTML = SVG_SCHLUESSEL;
  const tk = L.tuer && $('feld').querySelector(`[data-rc="${L.tuer.r},${L.tuer.c}"]`);
  if(tk) tk.innerHTML = SVG_TUER;
  $('feld').querySelectorAll('.spur').forEach(k => k.classList.remove('spur'));
  zeichneLeiste();
}
async function fastGeschafft(gebumst, tuerZu, alleSachen, fehlerIdx){
  let text;
  if(tuerZu) text = 'Die Tür ist zu. Der Roboter braucht erst den Schlüssel.';
  else if(gebumst) text = 'Ups, da war ein Hindernis. Nimm die rote Karte weg und probier eine andere.';
  else if(!alleSachen) text = 'Fast! Es fehlt noch etwas. Ändere deinen Weg.';
  else text = 'Fast! Der Roboter steht noch nicht beim Haus. Häng noch eine Karte an.';
  Voice.replace({text});
  if(!S.trostGegeben){           // kleine Belohnung fürs Probieren, nur einmal
    S.trostGegeben = true; S.trostFuer = S.aufgabe;
    sterneDazu(1);
  }
  // Roboter fährt zurück zum Start, die Karten bleiben liegen
  await warte(500);
  bot = {r:L.start.r, c:L.start.c, d:bot.d};
  setzeRoboter(true);
  await warte(350);
  feldZuruecksetzen();
  S.busy = false; $('tasten').classList.remove('aus');
  zeichnePlan();
  if(fehlerIdx >= 0 && $('plan').children[fehlerIdx])
    $('plan').children[fehlerIdx].classList.add('fehler');   // Karte bleibt markiert
  tippPlanen();
}

function sterneDazu(n){
  const vorher = S.sterne;
  S.sterne += n; $('punkte').textContent = S.sterne; save();
  S.neuOffen = S.neuOffen.concat(neuFreigeschaltet(vorher, S.sterne));
  $('punkteChip').style.transform = 'scale(1.18)';
  setTimeout(() => $('punkteChip').style.transform = '', 220);
}

let festInfo = {gross:false, optimal:false};
async function gewonnen(){
  const optimal = !!L.opt && prog.length <= L.opt;
  $('roboter').classList.add('tanz');
  SFX.tanz(); vib([30,60,30,60,80]);
  await warte(1500);
  $('roboter').classList.remove('tanz');
  const belohnung = 3 + L.sterne.length + (L.schluessel ? 1 : 0) + (optimal ? 1 : 0);
  sterneDazu(belohnung);
  S.aufgabe += 1; save();
  const rundeFertig = S.aufgabe % 4 === 0;
  if(rundeFertig){ S.sammlung += 1; save(); }
  const lob = KIND ? `Super, ${KIND}!` : 'Super gemacht!';
  let text = rundeFertig
    ? `${lob} Eine ganze Runde geschafft. Du bekommst einen neuen Planeten.`
    : `${lob} Der Roboter ist zu Hause.`;
  if(optimal) text += ' Und das war der kürzeste Weg. Dafür gibt es einen Extra-Stern!';
  Voice.replace({text});
  festInfo = {gross:rundeFertig, optimal};
  zeigeFest(rundeFertig, optimal);
}

const PLANETEN = ['🪐','🌙','☄️','🌍','🚀','🛸','🌟','🌈','🌞','🦄','🐙','🍭'];
function zeigeFest(gross, optimal){

  if(neu){

    $('festText').textContent = 'Neu in der Werkstatt!';
    $('wKnopf').hidden = false;
    Voice.say({text:'Etwas Neues ist in der Werkstatt. Schau mal rein!'});
  }else{
    if(gross){
      $('festBild').innerHTML = `<div style="font-size:min(30vw,150px)">${PLANETEN[(S.sammlung-1) % PLANETEN.length]}</div>`;
    }else{
      let h = '<div class="sternReihe">' + [0,1,2].map(i =>
        `<span class="festStern" style="--d:${(i*.33).toFixed(2)}s">${SVG_STERN}</span>`).join('') + '</div>';
      [0,1,2].forEach(i => SFX.sternPop(i));           // Plings passend zum Einfliegen
      const extras = L.sterne.length + (L.schluessel ? 1 : 0);
      if(extras) h += `<div class="sternMini">${'⭐'.repeat(extras)}</div>`;
      if(optimal) h += `<div class="bonusChip">✨ kürzester Weg +1</div>`;
      $('festBild').innerHTML = h;
    }
    $('festText').textContent = gross ? 'Runde geschafft!' : 'Geschafft!';
    $('wKnopf').hidden = true;
  }
  f.hidden = false;
  konfetti(gross ? 34 : 16);
  if(gross) SFX.fest();
  S.busy = false; $('tasten').classList.remove('aus');
  clearTimeout(tippTimer);
}
function konfetti(n){
  const box = document.createElement('div');
  box.className = 'konfetti';
  for(let i=0;i<n;i++){
    const s = document.createElement('div');
    s.className = 'konf';
    s.textContent = ['⭐','✨','🌟'][i%3];
    s.style.left = Math.random()*100+'vw';
    s.style.animationDelay = (Math.random()*.8)+'s';
    box.appendChild(s);
  }
  document.body.appendChild(box);
  setTimeout(() => box.remove(), 3400);
}


/* ----------------------------------------------------------- Werkstatt -- */
/* Nichts wird bezahlt: Alles schaltet sich bei einer Sternenzahl frei und
   bleibt für immer da. Sterne werden nie abgezogen.                        */
const ROBOTER = [
  {id:'tuerkis', ab:0,   name:'Türkis',    f:{koerper:'#2FB8C6', dunkel:'#12414A', arm:'#1C6B75', antenne:'#FFC53D'}},
  {id:'kirsche', ab:15,  name:'Kirsche',   f:{koerper:'#E4572E', dunkel:'#5B1E0E', arm:'#A63418', antenne:'#FFD166'}},
  {id:'wiese',   ab:45,  name:'Grasgrün',  f:{koerper:'#4CAF6A', dunkel:'#16401F', arm:'#2F7B45', antenne:'#FFE066'}},
  {id:'lila',    ab:80,  name:'Lila',      f:{koerper:'#9B6BD6', dunkel:'#2E1B4D', arm:'#6E44A8', antenne:'#FFC53D'}},
  {id:'gold',    ab:120, name:'Gold',      f:{koerper:'#F0B429', dunkel:'#4A3206', arm:'#C98A10', antenne:'#FFF3C4'}},
  {id:'rosa',    ab:170, name:'Rosa',      f:{koerper:'#F48FB1', dunkel:'#5A1E35', arm:'#D45C86', antenne:'#FFF3C4'}}
];
const WELTEN = [
  {id:'weltraum', ab:0,   name:'Weltraum',
   hg:'radial-gradient(120% 90% at 50% 0%,#33457d 0%,#233158 45%,#161e3c 100%)',
   kachel:'#EAF0FF', kachel2:'#DCE5FA', stein:() => SVG_STEIN, ziel:() => SVG_HAUS},
  {id:'wiese',    ab:30,  name:'Wiese',
   hg:'radial-gradient(120% 90% at 50% 0%,#5FA45A 0%,#3C7A46 45%,#24512F 100%)',
   kachel:'#F1F8E8', kachel2:'#E2F0D4', stein:() => SVG_BUSCH, ziel:() => SVG_NEST},
  {id:'eis',      ab:60,  name:'Eiswelt',
   hg:'radial-gradient(120% 90% at 50% 0%,#5E8FB5 0%,#3C6486 45%,#22384C 100%)',
   kachel:'#F2FAFF', kachel2:'#DFF0FA', stein:() => SVG_EIS, ziel:() => SVG_IGLU},
  {id:'wueste',   ab:100, name:'Wüste',
   hg:'radial-gradient(120% 90% at 50% 0%,#C99B53 0%,#9A6F34 45%,#5E421E 100%)',
   kachel:'#FFF6E4', kachel2:'#FBEBCD', stein:() => SVG_KAKTUS, ziel:() => SVG_ZELT},
  {id:'bonbon',   ab:150, name:'Bonbonland',
   hg:'radial-gradient(120% 90% at 50% 0%,#E98BB5 0%,#B85C8C 45%,#6E2F52 100%)',
   kachel:'#FFF1F7', kachel2:'#FBDCE9', stein:() => SVG_KEKS, ziel:() => SVG_LEBKUCHENHAUS}
];
const KARTENSTILE = [
  {id:'blau', ab:0,   name:'Blau',   fuell:'#2E6FB7', rand:'#1B4B80'},
  {id:'pink', ab:20,  name:'Pink',   fuell:'#F0568F', rand:'#A32A5C'},
  {id:'holz', ab:70,  name:'Holz',   fuell:'#C98A4B', rand:'#8A5A28'},
  {id:'neon', ab:140, name:'Neon',   fuell:'#8CF04A', rand:'#2C7A12'}
];
const KATEGORIEN = [
  {key:'bot',   titel:'Roboter',   liste:ROBOTER},
  {key:'welt',  titel:'Welt',      liste:WELTEN},
  {key:'karte', liste:KARTENSTILE, titel:'Pfeilkarten'}
];
const frei_ab = (item) => S.sterne >= item.ab;
const gewaehlt = k => {
  const kat = KATEGORIEN.find(x => x.key === k);
  return kat.liste.find(i => i.id === S.look[k]) || kat.liste[0];
};
function anwenden(){
  const bot = gewaehlt('bot'), welt = gewaehlt('welt'), karte = gewaehlt('karte');
  const rs = document.documentElement.style;
  rs.setProperty('--kachel', welt.kachel);
  rs.setProperty('--kachel2', welt.kachel2);
  rs.setProperty('--karteFuell', karte.fuell);
  rs.setProperty('--karteRand', karte.rand);
  rs.setProperty('--akzent', bot.f.antenne);
  document.body.style.background = welt.hg;
  document.querySelectorAll('.overlay').forEach(o => o.style.background = welt.hg);
  const koerper = document.querySelector('#roboter .koerper');
  if(koerper) koerper.innerHTML = svgRoboter(bot.f);
  if($('startBot')) $('startBot').innerHTML = svgRoboter(bot.f);
  document.querySelectorAll('.pfeil').forEach(b => b.innerHTML = pfeilIcon(+b.dataset.d));
  if(L && $('feld')){                       // laufendes Feld auf die neue Welt umstellen
    $('feld').querySelectorAll('.kachel.stein').forEach(k => k.innerHTML = welt.stein());
    if(L.ziel){
      const zk = $('feld').querySelector(`[data-rc="${L.ziel.r},${L.ziel.c}"]`);
      if(zk) zk.innerHTML = welt.ziel();
    }
    zeichneLeiste(); zeichnePlan();
  }
}
/* Was ist neu dazugekommen? */
function neuFreigeschaltet(vorher, nachher){
  const neu = [];
  KATEGORIEN.forEach(kat => kat.liste.forEach(i => {
    if(i.ab > vorher && i.ab <= nachher) neu.push({kat:kat.key, item:i});
  }));
  return neu;
}
function vorschau(katKey, item){
  if(katKey === 'bot')  return `<div class="vs">${svgRoboter(item.f)}</div>`;
  if(katKey === 'welt') return `<div class="vs welt" style="background:${item.hg}">
      <div class="mini" style="background:${item.kachel}">${item.ziel()}</div>
      <div class="mini" style="background:${item.kachel2}">${item.stein()}</div></div>`;
  return `<div class="vs" style="--karteFuell:${item.fuell};--karteRand:${item.rand}">${SVG_PFEIL}</div>`;
}
function zeigeWerkstatt(){
  ac(); clearTimeout(tippTimer); Voice.flush();
  const w = $('werkstatt');
  let h = '';
  KATEGORIEN.forEach(kat => {
    h += `<div class="reihe"><div class="reiheKopf">${
      kat.key==='bot' ? '🤖' : kat.key==='welt' ? '🌍' : '➡️'}</div><div class="kacheln">`;
    kat.liste.forEach(item => {
      const offen = frei_ab(item), aktiv = gewaehlt(kat.key).id === item.id;
      h += `<button class="wItem${offen?'':' zu'}${aktiv?' aktiv':''}" data-kat="${kat.key}" data-id="${item.id}"
              aria-label="${item.name}">${vorschau(kat.key, item)}
              ${offen ? (aktiv ? '<span class="haken">✓</span>' : '')
                      : `<span class="schloss">⭐ ${item.ab}</span>`}</button>`;
    });
    h += '</div></div>';
  });
  $('wInhalt').innerHTML = h;
  $('wSterne').textContent = S.sterne;
  w.hidden = false;
}

/* ---------------------------------------------------------- Bedienung --- */
document.querySelectorAll('.pfeil').forEach(b => {
  b.innerHTML = pfeilIcon(+b.dataset.d);
  b.addEventListener('click', () => karteDazu(+b.dataset.d));
});
$('b_los').innerHTML = SVG_PLAY;
$('b_los').addEventListener('click', starten);
$('b_schleife').addEventListener('click', () => karteDazu('x'));
$('b_undo').addEventListener('click', () => karteWeg());
$('b_clear').addEventListener('click', () => {
  if(S.busy) return;
  ac(); prog = []; SFX.klick();
  if(S.frei) $('feld').querySelectorAll('.spur').forEach(k => k.classList.remove('spur'));
  zeichnePlan(); tippPlanen();
});
$('b_hoer').addEventListener('click', () => {
  ac();
  if(S.frei) Voice.replace({text:'Freies Fahren. Bau einen Weg und schau zu, wohin der Roboter fährt.'});
  else Voice.replace({text:L.sag});
  tippPlanen();
});
$('plan').addEventListener('click', e => {
  const slot = e.target.closest('.slot');
  if(!slot || !slot.classList.contains('voll')) return;
  karteWeg(+slot.dataset.i);
});
$('werkstattChip').addEventListener('click', () => { if(!S.busy) zeigeWerkstatt(); });
$('wKnopf').addEventListener('click', () => { $('fest').hidden = true; S.neuOffen = []; zeigeWerkstatt(); });
$('wFertig').addEventListener('click', () => {
  ac(); $('werkstatt').hidden = true; SFX.klick();
  if($('fest').hidden) tippPlanen();
});
$('wInhalt').addEventListener('click', e => {
  const b = e.target.closest('.wItem'); if(!b) return;
  const kat = KATEGORIEN.find(k => k.key === b.dataset.kat);
  const item = kat.liste.find(i => i.id === b.dataset.id);
  if(!frei_ab(item)){
    SFX.nope();
    b.classList.add('wackel'); setTimeout(() => b.classList.remove('wackel'), 1300);
    Voice.replace({text:`Dafür brauchst du noch ${item.ab - S.sterne} Sterne. Das schaffst du!`});
    return;
  }
  S.look[b.dataset.kat] = item.id; save();
  SFX.pop(); anwenden(); zeigeWerkstatt();
});
$('weiter').addEventListener('click', () => {
  ac(); $('fest').hidden = true; S.neuOffen = [];
  if(S.frei) freiesFahren(); else neueAufgabe();
});
/* Sieg noch einmal ansehen: gleicher Lauf, keine doppelte Belohnung */
$('nochmal').addEventListener('click', async () => {
  ac(); $('fest').hidden = true; S.replay = true;
  S.neuOffen = [];                     // „Neu in der Werkstatt" wurde schon gezeigt
  await starten();
});
/* 🔇 für Eltern: SFX und Sprache zusammen stummschalten */
$('ton').addEventListener('click', () => {
  ac();
  S.ton = !S.ton; save();
  $('ton').textContent = S.ton ? '🔊' : '🔇';
  if(!S.ton) Voice.flush(); else SFX.klick();
});
$('freiChip').addEventListener('click', () => {
  ac();
  if(S.busy) return;
  $('fest').hidden = true;
  if(S.frei){ S.frei = false; neueAufgabe(); }
  else freiesFahren();
});
$('fs').addEventListener('click', () => {
  if(!document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(()=>{});
  else document.exitFullscreen?.();
});

/* Eltern-Reset: Punkteanzeige 3 Sekunden gedrückt halten */
let resetT;
$('punkteChip').addEventListener('pointerdown', () => { resetT = setTimeout(() => {
  if(confirm('Spielstand wirklich zurücksetzen?')){ localStorage.removeItem(SAVE_KEY); location.reload(); }
}, 3000); });
['pointerup','pointerleave','pointercancel'].forEach(ev =>
  $('punkteChip').addEventListener(ev, () => clearTimeout(resetT)));
/* Eltern: Aufgaben-Chip 3 Sekunden halten → zu einer Aufgabe springen */
let wahlT;
$('aufgabeChip').addEventListener('pointerdown', () => { wahlT = setTimeout(() => {
  if(S.busy) return;
  const eingabe = prompt(`Zu welcher Aufgabe? (1–${LEVELS.length}, größer = Endlos-Aufgaben)`, S.aufgabe + 1);
  const n = parseInt(eingabe, 10);
  if(!eingabe || isNaN(n) || n < 1) return;
  S.aufgabe = n - 1; S.frei = false; save();
  $('fest').hidden = true; $('werkstatt').hidden = true;
  if(document.getElementById('start')) $('start').remove();
  neueAufgabe();
}, 3000); });
['pointerup','pointerleave','pointercancel'].forEach(ev =>
  $('aufgabeChip').addEventListener(ev, () => clearTimeout(wahlT)));

function startSpiel(freiModus){
  ac();
  document.documentElement.requestFullscreen?.().catch(()=>{});
  $('start').remove();
  setTimeout(() => { if(freiModus) freiesFahren(); else neueAufgabe(); }, 200);
}
$('go').addEventListener('click', () => startSpiel(false));
$('goFrei').addEventListener('click', () => startSpiel(true));

let rT;
window.addEventListener('resize', () => { clearTimeout(rT); rT = setTimeout(() => { metrics(); zeichnePlan(); }, 120); });
document.addEventListener('contextmenu', e => e.preventDefault());

/* Hintergrund (mehrere Apps offen): komplett schweigen. Die Sprachausgabe des
   Systems wird von ALLEN Apps geteilt — ohne das quatscht hier etwas in die
   Pizzeria hinein und umgekehrt. Auch der Tipp-Timer stoppt im Hintergrund. */
document.addEventListener('visibilitychange', () => {
  if(document.hidden){
    Voice.flush();                                   // laufende Ansage sofort aus
    clearTimeout(tippTimer);                         // kein Tipp-Timer im Hintergrund
    if(AC && AC.state === 'running') AC.suspend().catch(()=>{});
  }else{
    if(AC && AC.state === 'suspended') AC.resume().catch(()=>{});
    if(L && !document.getElementById('start')) tippPlanen();
  }
});
window.addEventListener('pagehide', () => { Voice.flush(); clearTimeout(tippTimer); });

/* ------------------------------------------------------------- Start ---- */
load();
$('punkte').textContent = S.sterne;
$('aufgabe').textContent = S.aufgabe + 1;
$('ton').textContent = S.ton ? '🔊' : '🔇';
$('startBot').innerHTML = svgRoboter();
anwenden();
$('sammlung').innerHTML = Array.from({length:S.sammlung},
  (_,i) => `<span>${PLANETEN[i % PLANETEN.length]}</span>`).join('');

if('serviceWorker' in navigator){
  // Neue Version aktiviert sich sofort (skipWaiting); damit sie nicht erst beim
  // übernächsten Start sichtbar wird, einmal neu laden — aber nie mitten im Spiel.
  let hatteSW = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if(hatteSW && !S.busy && document.getElementById('start')) location.reload();
    hatteSW = true;
  });
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
</script>
